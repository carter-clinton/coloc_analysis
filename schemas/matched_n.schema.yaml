$schema: "http://json-schema.org/draft-07/schema#"
description: "JSON schema validation for config/matched_n.yaml — Phase 4 matched-N cross-ancestry concordance parameters"
type: object
required:
  - bootstrap_n
  - seed_base
  - h7_reduction_threshold_pp
  - concordance_threshold
  - relaxed_pph4_threshold
  - rg_fdr_q
  - rg_se_flag_threshold
  - ancestry_pairs
  - traits
  - rg_trait_pairs_n
  - rg_ancestry_pairs
  - output_root
  - bootstrap_fits_root
additionalProperties: false
properties:
  bootstrap_n:
    type: integer
    minimum: 10
    maximum: 10000
    description: "Number of bootstrap resamples per (trait x region) — D-01b"
  seed_base:
    type: integer
    minimum: 1
    description: "Base for deterministic seed formula: seed_base * trait_id + bootstrap_idx"
  h7_reduction_threshold_pp:
    type: integer
    minimum: 1
    maximum: 100
    description: "H7 pre-registered threshold: absolute pp reduction — D-02d"
  concordance_threshold:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "Tier A PP.H4 concordance threshold — D-02a"
  relaxed_pph4_threshold:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "Relaxed PP.H4 threshold for Jaccard gate — D-02b"
  rg_fdr_q:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "BH-FDR q-value threshold across all r_g tests — D-04c"
  rg_se_flag_threshold:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: "LDSC r_g SE threshold — flag if SE > this value — RESEARCH A-2"
  ancestry_pairs:
    type: array
    minItems: 1
    items:
      type: array
      minItems: 2
      maxItems: 2
      items:
        type: string
    description: "Ancestry pairs for matched-N bootstrap — D-03a"
  traits:
    type: array
    minItems: 1
    items:
      type: string
    description: "T1 traits for matched-N analysis — D-03a"
  rg_trait_pairs_n:
    type: integer
    minimum: 1
    description: "Number of trait pairs for r_g matrix — D-04a"
  rg_ancestry_pairs:
    type: array
    minItems: 1
    items:
      type: string
    description: "Ancestry-pair strata for r_g matrix — D-04a"
  output_root:
    type: string
    minLength: 1
    description: "Output directory for matched-N results"
  bootstrap_fits_root:
    type: string
    minLength: 1
    description: "Root directory for bootstrap .fit.rds files on /rs1 allocation"
