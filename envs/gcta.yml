# envs/gcta.yml -- GCTA 1.94.1 env for COJO sensitivity (Phase 9 Plan 09-05)
#
# GCTA's `--cojo-slct` performs stepwise conditional + joint analysis on
# GWAS sumstats using an external LD reference. Phase 9 uses 1000G Phase 3
# EUR / AFR panels (503 / 661 samples) as the LD reference — below the ~4K
# sample threshold recommended by the GCTA authors (Yang et al. 2012) — so
# COJO output is scoped as SUPPLEMENTARY tier only, documented as such in
# methods (D-04c + RESEARCH §6 Option D).
name: gcta
channels:
  - bioconda
  - conda-forge
dependencies:
  - gcta=1.94.1
  - python=3.11
