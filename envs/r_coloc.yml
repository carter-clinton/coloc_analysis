# envs/r_coloc.yml -- Pinned R + coloc + susieR + hyprcoloc environment (D-24)
# Seeded from src/legacy/region_analysis/envs/r_stats_env.yml with version pins added.
# Version pins verified: R 4.4.2, coloc 5.2.3, susieR 0.14.2 (from RESEARCH.md).
name: r_coloc
channels:
  # defaults dropped (quick 260414-wzy): all deps on conda-forge + bioconda.
  # Avoids Anaconda ToS prompt with mamba 2.5 (SCOUT-FINDINGS.md issue #5).
  - conda-forge
  - bioconda
dependencies:
  - r-base=4.4.2
  - r-data.table=1.16.4
  - r-tidyverse=2.0.0
  - r-optparse=1.7.5
  - r-yaml=2.3.10
  - r-susier=0.14.2
  - r-coloc=5.2.3
  - r-remotes  # needed to install hyprcoloc from GitHub + winnerscurse (Phase 9)
  - htslib=1.21
  # NOTE: hyprcoloc is not available via conda. After env creation, install via:
  #   conda activate r_coloc && Rscript -e 'remotes::install_github("jrs95/hyprcoloc")'
  #
  # Phase 9 additions (2026-04-14): metafor for IVW meta (D-06b),
  # winnerscurse for FIQT winner's-curse correction (D-04a).
  # winnerscurse is GitHub-only; src/snakemake/scripts/run_fiqt.R lazy-installs
  # on first use — no manual step required. Installs are SHA-pinned to
  # commit `2ed00bb` (amandaforde/winnerscurse, 2024-03-07) so fresh hosts
  # reproduce the same FIQT implementation. If the pin is ever changed,
  # also update docs/methods/phase9_replication.md L62 in the same commit.
  - r-metafor>=3.0
  - r-data.table>=1.14
