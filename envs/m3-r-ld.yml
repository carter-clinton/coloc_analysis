# envs/m3-r-ld.yml -- M3 .npz -> .rds R env (Wave 3 src/scripts/ld_npz_to_rds.R)
#
# Purpose: back the NCSU-side R script that converts AoU-exported .npz LD
# matrices into .rds files consumed by SuSiE-RSS in M4. Uses reticulate to
# load numpy archives (matches existing envs/r_coloc.yml + AOU-LD-PIPELINE.md
# §8.2 pattern). pyliftover is included for any Wave 3 variant-ID liftover
# the R conversion script may need (DEC-2026-04-24-01: AoU emits GRCh38;
# project canonical analytic plane is GRCh37).
#
# Conventions:
# - python=3.11 pin (CLAUDE.md Snakemake-compat) on the reticulate side.
# - r-base=4.4 pin matches Track A's existing R 4.4 substrate.
# - testthat for the .npz <-> .rds round-trip + symmetry recovery + dimnames
#   preservation test in Wave 3 (test_ld_npz_to_rds.R, not landed at Wave 0).
#
# Channels: conda-forge / bioconda only (matches envs/r_coloc.yml convention;
# avoids r-channel which has a separate package-naming idiom).

name: m3-r-ld
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - r-base=4.4.*
  - r-reticulate
  - r-matrix
  - r-testthat
  - r-jsonlite
  - r-digest
  - r-data.table
  # m3-02b additions: the real-loader contract test
  # (tests/m3/test_finemap_loader_contract.py) exercises
  # run_susie_rss.R::load_ld_matrix() -> susieR::susie_rss(); the no-skip
  # must_have A6 forbids pytest.skip on the R-dependent families IN THIS env,
  # so susieR + coloc are correctness requirements here (not optional).
  # r-digest backs ld_npz_to_rds.R's chain SHA-256 provenance.
  - r-susier
  - r-coloc
  # run_susie_rss.R's top library block needs optparse + yaml (in addition to
  # the data.table/susieR/jsonlite/Matrix/digest/coloc already listed); the
  # loader-contract test source()s that file, so both must be in the M3 env.
  - r-optparse
  - r-yaml
  - numpy>=1.26
  # m3-04b (Rule-3 deviation, blocking): src/python/assemble_occlusion_catalog.py
  # runs under this env (rule m3_assemble_occlusion_catalog) and its whole call
  # chain -- occlusion_manifest + drop_occluded_from_sumstats -- is pandas-based.
  # The m3-04b PLAN asserted this env already carried pandas; it did NOT (verified:
  # ModuleNotFoundError in the built env). pandas is added here rather than
  # pyliftover being added to envs/python_stats.yml, because python_stats backs a
  # dozen already-built rules (harmonize_sumstats, collect_region_variants, ...) and
  # re-hashing it would force a rebuild across the whole pipeline; this env already
  # carries python 3.11 + numpy + pyliftover and is only consumed by M3 rules.
  - pandas>=2.2
  - pip
  - pip:
      # m3-04c Task 1a: NAMED CONSUMERS of this entry, so a future edit cannot
      # drop it without seeing what breaks --
      #   src/python/build_ld_region_manifest.py   (GRCh37 -> GRCh38 manifest)
      #   src/python/build_curated_m2_crosswalk.py (M2 GRCh38 windows -> GRCh37,
      #     via data/external/liftover/hg38ToHg19.over.chain.gz, the ONLY chain
      #     the repo ships). The crosswalk decides WHICH LD panel each curated
      #     Track-A locus reads, so losing pyliftover silently un-builds a config
      #     artifact the fine-mapping DAG depends on. That module imports it
      #     LAZILY and raises a named ImportError pointing back here, and its
      #     finemap.smk-facing loader never touches it at all.
      - pyliftover
