# envs/ld_build.yml -- Lightweight LD panel building env (Plan 01-02, REQ-2)
#
# Purpose: back the `download_ukbb_ld_tiles` rule (UKBB-LD EUR panel) and its
# sibling HGDP+1kG rule (Plan 01-03). Python-first: numpy, scipy, boto3, and
# pandas pull + extract LD tile NPZ tiles; a thin R bridge writes the `.rds`
# that the existing run_susie_rss.R loader consumes.
#
# Explicit exclusions (kept out to preserve portability and solver time):
# the Broad population-genetics framework is intentionally NOT listed, and
# neither is any Spark stack -- they are not needed at this scale and would
# balloon the dependency closure. See 01-RESEARCH.md Standard-Stack decision.
#
# Non-dogmatic pins: upper bounds held loose to minimize solver friction on
# HPC conda channels while keeping the API surface we depend on stable.
name: ld_build
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - numpy=1.26
  - scipy=1.13
  - pandas=2.2
  - boto3=1.34
  - botocore=1.34
  - requests
  - pyarrow
  - r-base=4.4
  - r-data.table
  - r-yaml
  - bcftools=1.21
  - plink2
  - pyyaml
  - jsonschema
  - pip
  - pip:
      - pyreadr==0.5.2
