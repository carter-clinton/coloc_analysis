# envs/m2-novelty.yml — M2 Wave 5 Class 1 novelty calling env
#
# REQ-NOVELTY-CLASS-1 + D-M2-05: Class 1 = high-confidence joint-signal
# novelty (MTAG ∩ CPASSOC, ±500 kb GWAS Catalog window enforced).
#
# Reads:
#   - data/processed/mtag/{stratum}/*_mtag.txt (MTAG-novel + max_FDR<0.05)
#   - data/processed/cpassoc/{stratum}/*_cpassoc.tsv (CPASSOC-novel)
#   - data/catalogs/gwas-catalog-associations-full.zip (v_lock_M2 frozen)
# Writes:
#   - results/novelty/joint_signal_novel.tsv
name: m2-novelty
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - bedtools=2.31.1
  - pybedtools=0.10
  - pandas=2.2.2
  - pyarrow=15.0.0
  - pyyaml
  - pytest=7.4.4
