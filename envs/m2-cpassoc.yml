# envs/m2-cpassoc.yml — M2 Wave 3 CPASSOC (Zhu 2015) SHom/SHet env
#
# D-M2-04: Python reimplementation of Zhu 2015 SHom + SHet test statistics
# at src/python/cpassoc.py. LDSC bivariate-intercept matrix (M1 frozen)
# serves as the cohort-correlation matrix R.
#
# REQ-CPASSOC-ORTHOGONAL: Provides the orthogonal joint-signal corroboration
# filter alongside MTAG (Class 1 high-confidence = MTAG ∩ CPASSOC).
name: m2-cpassoc
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - numpy=1.26.4
  - scipy=1.11.4
  - pandas=2.2.2
  - pyarrow=15.0.0
  - pyyaml
  - pytest=7.4.4
