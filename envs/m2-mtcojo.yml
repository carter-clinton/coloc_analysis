# envs/m2-mtcojo.yml — M2 Wave 4 mtCOJO sensitivity env
#
# D-M2-08 + D-M2-Q5: mtCOJO (Zhu 2018) is bundled with GCTA. Used as the
# overlap-correction sensitivity check on MTAG-novel target traits with
# extreme overlap (gcov_int > 0.1 with any contributing trait).
#
# D-M2-Q3: TRANS-stratum mtCOJO uses 1000G EUR LD primary + 1000G AFR
# sensitivity. EUR/AFR strata use the matched 1000G LD panel.
name: m2-mtcojo
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - gcta=1.94.1          # mtCOJO bundled with GCTA (Zhu 2018)
  - pandas=2.2.2
  - pyyaml
  - pytest=7.4.4
