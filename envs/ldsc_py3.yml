# envs/ldsc_py3.yml -- Python 3 environment for LDSC (Phase 5)
# Uses the abdenlab/ldsc-python3 fork per D-07c (Python 3 compatibility).
# Original LDSC (Bulik-Sullivan 2015) requires Python 2.7; this fork
# modernizes the codebase for Python 3.11+ without altering statistical logic.
name: ldsc_py3
channels:
  # defaults dropped (quick 260414-wzy): all deps available via conda-forge.
  # Avoids Anaconda ToS prompt with mamba 2.5 (SCOUT-FINDINGS.md issue #5).
  - conda-forge
dependencies:
  # REQ-9: exact version pins for reproducibility. Versions chosen to match
  # the conda-forge snapshot at the time of Phase 5 initial build (Apr 2026).
  - python=3.11.8
  - pandas=2.2.1
  - numpy=1.26.4
  - scipy=1.11.4
  - bitarray=2.9.2
  - pyyaml=6.0.1
  - pip=24.0
  - pip:
      - ldsc-python3 @ git+https://github.com/abdenlab/ldsc-python3.git
