# envs/ldsc_py3.yml -- Python 3 environment for LDSC (Phase 5)
# Uses the abdenlab/ldsc-python3 fork per D-07c (Python 3 compatibility).
# Original LDSC (Bulik-Sullivan 2015) requires Python 2.7; this fork
# modernizes the codebase for Python 3.11+ without altering statistical logic.
name: ldsc_py3
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pandas>=2.0
  - numpy>=1.24
  - scipy>=1.11
  - bitarray>=2.8
  - pyyaml>=6.0
  - pip
  - pip:
      - ldsc-python3 @ git+https://github.com/abdenlab/ldsc-python3.git
