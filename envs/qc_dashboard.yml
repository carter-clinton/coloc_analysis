# envs/qc_dashboard.yml -- Quarto + RMarkdown dashboard render env for Plan 01-05
# REQ-2 acceptance #5: Per-locus fine-mapping QC report.
# Kept separate from envs/r_coloc.yml to avoid env bloat per 01-RESEARCH.md.
# Fallback: if the conda `quarto` package fails to resolve on a given host,
# `rmarkdown::render(...)` via r-rmarkdown still produces a valid HTML dashboard.
name: qc_dashboard
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - pandas=2.2
  - pyyaml
  - r-base=4.4
  - r-rmarkdown
  - r-knitr
  - r-dt
  - r-data.table
  - r-jsonlite
  - r-yaml
  - quarto
