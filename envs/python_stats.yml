# envs/python_stats.yml -- Pinned Python stats + Snakemake orchestrator environment (D-24)
# Seeded from src/legacy/region_analysis/envs/snakemake_env.yml with version pins added.
# CRITICAL FIX: Legacy had snakemake==8.* but actual installed version is 7.32.4.
# Pinned to 7.32.4 per RESEARCH.md recommendation (defer 8.x migration).
name: python_stats
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.11
  - snakemake=7.32.4
  - pandas=2.2.3
  - numpy=1.26.4
  - scipy=1.14.1
  - pyarrow=18.1.0
  - cytoolz=1.0.1
  - pyyaml=6.0.2
  - click=8.1.7
  - requests=2.32.3
  - htslib=1.21
  - pip
  - pip:
    - loguru==0.7.3
