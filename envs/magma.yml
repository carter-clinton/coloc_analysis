# envs/magma.yml -- Python environment for MAGMA helper scripts (Phase 5)
# Used by: build_magma_geneset.py, magma_annotate, magma_gene_analysis,
#          magma_geneset_analysis rules in pathway.smk.
# NOTE: This env is for Python helper scripts only. The MAGMA binary itself is
# a statically linked Linux executable downloaded by the download_magma_binary rule.
name: magma_helpers
channels:
  # defaults dropped (quick 260414-wzy): all deps available via conda-forge.
  # Avoids Anaconda ToS prompt with mamba 2.5 (SCOUT-FINDINGS.md issue #5).
  - conda-forge
dependencies:
  # REQ-9: exact version pins for reproducibility. Versions chosen to match
  # the conda-forge snapshot at the time of Phase 5 initial build (Apr 2026).
  - python=3.11.8
  - pandas=2.2.1
  - numpy=1.26.4
  - scipy=1.11.4
  - statsmodels=0.14.1
  - pyyaml=6.0.1
  - requests=2.31.0
