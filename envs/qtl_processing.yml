# envs/qtl_processing.yml -- Python environment for QTL data processing (Phase 2)
# Used by: liftover_regions.py, variant_id_map.py, harmonize_*.py
# Conda env for downloading, lifting, and harmonizing eQTL/pQTL/sQTL data.
name: qtl_processing
channels:
  # defaults dropped (quick 260414-wzy): all deps on conda-forge + bioconda
  # (synapseclient is bioconda). Avoids Anaconda ToS prompt with mamba 2.5
  # (SCOUT-FINDINGS.md issue #5).
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - synapseclient
  - crossmap>=0.7
  - pyliftover>=0.4
  - pyarrow>=10.0
  - pybedtools>=0.10
  - pysam>=0.22
  - pandas>=2.0
  - pyyaml>=6.0
  - pytest>=7.0
  - tabix  # htslib
