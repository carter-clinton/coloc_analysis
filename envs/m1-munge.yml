# envs/m1-munge.yml — M1 LDSC munge env (Wave 3a)
# abdenlab/ldsc-python3 fork (Python 3.11-compatible) per envs/ldsc_py3.yml line 21.
# numpy<2 pin enforces compatibility with the LDSC Py3 fork's bitarray + scipy
# call sites (researched 2026-04-24; matches envs/ldsc_py3.yml numpy=1.26.4 pin).
name: m1-munge
channels:
  - conda-forge
dependencies:
  - python=3.11.8
  - pandas=2.2.1
  - numpy=1.26.4         # numpy<2 — LDSC Py3 fork compat
  - scipy=1.11.4
  - bitarray=2.9.2
  - pyyaml=6.0.1
  - pytest>=7
  - pip=24.0
  - pip:
      - ldsc-python3 @ git+https://github.com/abdenlab/ldsc-python3.git
