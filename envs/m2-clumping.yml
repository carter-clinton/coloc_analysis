# envs/m2-clumping.yml — M2 Wave 4 PLINK clumping env
#
# CRITICAL Pitfall 5 (m2-RESEARCH.md): PLINK 2.0 has NO --clump flag.
# MUST pin plink=1.9. PLINK 1.9 source: bioconda channel.
#
# D-M2-09 (region union): per-(trait × ancestry) PLINK clumped lead variants
# at p<5e-8, r²<0.01, 1 Mb clump-kb window feed the union region BED.
#
# This env is also reused by Wave 0 Task 4 (1000G AFR PLINK bfile build
# from VCFs via `plink --vcf ... --keep AFR.samples --make-bed`).
name: m2-clumping
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - plink=1.9            # CRITICAL: PLINK 2.0 has no --clump (Pitfall 5)
  - pandas=2.2.2
  - pyyaml
  - pytest=7.4.4
