# data/manifest.yaml -- Data source catalog with provenance (D-03, D-12)
# Every source records genome_build; GRCh38 sources are flagged needs_liftover: true (D-02).
# Fields: source, description, genome_build, ancestry, trait(s), local_path_pattern,
#   remote_url, doi, license, access_model, download_date, md5.

