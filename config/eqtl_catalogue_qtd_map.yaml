# eQTL Catalogue QTD (dataset_id) mapping for GTEx v8 (QTS000015).
# Each tissue is mapped to two QTDs: one for gene-level eQTL (ge quant method)
# and one for splice QTL (leafcutter quant method).
#
# Source: https://raw.githubusercontent.com/eQTL-Catalogue/eQTL-Catalogue-resources/master/data_tables/dataset_id_map.tsv
# Retrieved: 2026-04-20
#
# Keys are GTEx-portal Title_Case tissue names (matching 
# data/processed/qtl_harmonized/gtex_tissue_n_lookup.json). Values include:
#   - eqtl_qtd: QTD id for the gene-level eQTL allpairs file
#   - sqtl_qtd: QTD id for the leafcutter sQTL allpairs file
#   - catalogue_name: eQTL Catalogue sample_group (lowercase, simplified)
#
# File URL pattern (as of eQTL Catalogue r8, 2023-04):
#   https://ftp.ebi.ac.uk/pub/databases/spot/eQTL/sumstats/QTS000015/{QTD}/{QTD}.cc.tsv.gz
# Tabix index:
#   https://ftp.ebi.ac.uk/pub/databases/spot/eQTL/sumstats/QTS000015/{QTD}/{QTD}.cc.tsv.gz.tbi
#
# The file naming changed between eQTL Catalogue releases: the 2020 release used
# `{tissue}.all.tsv.gz` at tissue-named URLs; the 2023 r8 release uses
# `{QTD}.cc.tsv.gz` at QTD-named paths. Schema is backward-compatible (same column
# names, different ordering, extra `ma_samples` column in new release).

study_id: QTS000015
study_label: GTEx
release: r8
retrieved_at: "2026-04-20"
file_pattern:
  sumstats_url: "https://ftp.ebi.ac.uk/pub/databases/spot/eQTL/sumstats/{study_id}/{qtd_id}/{qtd_id}.cc.tsv.gz"
  tabix_url:    "https://ftp.ebi.ac.uk/pub/databases/spot/eQTL/sumstats/{study_id}/{qtd_id}/{qtd_id}.cc.tsv.gz.tbi"

