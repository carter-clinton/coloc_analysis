# config/pipeline_identity_overlay.yaml
#
# Identity-LD re-fire overlay for Route A (quick-260424-k2d).
# Loaded AFTER config/pipeline.yaml:
#
#   snakemake --configfile config/pipeline.yaml \
#             --configfile config/pipeline_identity_overlay.yaml ...
#
# Snakemake merges the second --configfile over the first, so every key
# below replaces the parent value. All other pipeline.yaml fields (traits,
# ancestries, onekg, resources, etc.) stay as parent.
#
# Purpose: isolate the identity-LD re-fire so Stage 2 real-LD outputs at
# results/fine_mapping/ and results/multitrait/coloc_susie/ remain
# byte-identical. The identity .rds payloads for 12 curated regions x EUR
# were pre-generated by src/snakemake/scripts/make_identity_ld_refs.R.

paths:
  # All results land under this namespace instead of results/
  # MULTITRAIT_DIR (src/snakemake/rules/multitrait.smk:24) derives from
  # RESULTS_ROOT = config["paths"]["results_root"], so coloc_susie pair JSONs
  # will write to results_identity_ld/multitrait/coloc_susie/*.json.
  results_root: "results_identity_ld"

  # LD matrix inputs read from the identity-LD namespace. run_finemap
  # (src/snakemake/rules/finemap.smk:56-60) resolves ld_matrix via
  # config["paths"]["ld_reference"] + /{ancestry}/{region}.rds.
  ld_reference: "data/processed/ld_reference_identity"

finemap:
  # FINEMAP_DIR (Snakefile:75-78) + FINEMAP_OUTPUTS (Snakefile:83-88) both
  # derive from config["finemap"]["output_dir"], so finemap JSONs land under
  # results_identity_ld/fine_mapping/susie/*.json.
  output_dir: "results_identity_ld/fine_mapping"

  # params.ld_dir passed to run_susie_rss.R via --ld-dir
  # (src/snakemake/rules/finemap.smk line 77). Redundant with
  # paths.ld_reference but both must match to avoid a mixed-source read.
  ld_reference_dir: "data/processed/ld_reference_identity"

# Disable ld_reference.smk rule inclusion. We pre-built identity-LD .rds
# payloads via src/snakemake/scripts/make_identity_ld_refs.R (12 files under
# data/processed/ld_reference_identity/EUR/) — the LD-build rules would try
# to regenerate these from 1000G VCFs on the fly and could clobber our
# identity payloads. Snakefile:141 gates LD rule inclusion on this flag.
enable_ld_pipeline: false
