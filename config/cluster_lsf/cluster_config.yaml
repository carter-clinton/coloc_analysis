# LSF cluster configuration for Snakemake on NCSU HPC cluster.
# Seeded from src/legacy/region_analysis/config/cluster_lsf.yaml (D-07).
# New rules (run_finemap, validate_sumstats, liftover_sumstats) added for Plan 03.

# NCSU HPC LSF cluster config.
# LSF_UNIT_FOR_LIMITS=GB — bsub_wrapper.sh converts mem_mb to GB.
# Queue rules:
#   serial:   1 slot only, no time cap, low prio — default for most rules
#   standard: min 8 slots, 48h max — for multi-thread rules
#   long:     min 2 slots, 10d max — for heavy compute
# Do NOT cap wall time — let jobs run to completion.

__default__:
  queue: "serial"
  mem_mb: 8000
  threads: 1

download_sumstats:
  mem_mb: 4000
  threads: 1

harmonize_sumstats:
  mem_mb: 8000
  threads: 1

make_regions_from_loci:
  mem_mb: 2000
  threads: 1

prepare_ld_plink:
  queue: "long"
  mem_mb: 32000
  threads: 4

run_finemap:
  queue: "long"        # FIX 2026-04-30 (W4 V2): was inheriting __default__ serial; bsub_wrapper.sh maps long -> -W 14400 min (240 hr); SuSiE-RSS layer rebuild needs long-queue routing for the W4 V2 CONSERVATIVE_BOTH re-fire
  mem_mb: 32000
  threads: 2           # FIX 2026-04-30 (W4 V3 -> V4): D-TA-WAVE4-V3-BSUB-TOO-FEW-TASKS-OUTCOME = Option E. long queue requires min 2 slots (header L8); threads=1 caused 50/50 bsub rejections "Too few tasks requested" in V3 dispatch. SuSiE-RSS R code is single-threaded so 1 of 2 slots is allocated-but-unused — accepted cost for queue-policy compliance without overthreading.

validate_sumstats:
  mem_mb: 4000
  threads: 1

liftover_sumstats:
  mem_mb: 8000
  threads: 1

# MAGMA gene analysis: EUR traits with >5M SNPs can need >30 min.
# bsub_wrapper.sh now sets -W to queue max (no more TERM_RUNLIMIT).
magma_gene_analysis:
  mem_mb: 8000
  threads: 1

# LDSC LD score computation: some chromosomes can exceed 30 min.
ldsc_compute_custom_ld_scores:
  mem_mb: 8000
  threads: 1
