# LSF cluster configuration for Snakemake on NCSU HPC cluster.
# Seeded from src/legacy/region_analysis/config/cluster_lsf.yaml (D-07).
# New rules (run_finemap, validate_sumstats, liftover_sumstats) added for Plan 03.

# NCSU HPC LSF cluster config.
# LSF_UNIT_FOR_LIMITS=GB — bsub_wrapper.sh converts mem_mb to GB.
# Queue rules:
#   serial:   1 slot only, no time cap, low prio — default for most rules
#   standard: min 8 slots, 48h max — for multi-thread rules
#   long:     min 2 slots, 10d max — for heavy compute
# Do NOT cap wall time — let jobs run to completion.

__default__:
  queue: "serial"
  mem_mb: 8000
  threads: 1

download_sumstats:
  mem_mb: 4000
  threads: 1

harmonize_sumstats:
  mem_mb: 8000
  threads: 1

make_regions_from_loci:
  mem_mb: 2000
  threads: 1

prepare_ld_plink:
  queue: "long"
  mem_mb: 32000
  threads: 4

run_finemap:
  mem_mb: 16000
  threads: 1

validate_sumstats:
  mem_mb: 4000
  threads: 1

liftover_sumstats:
  mem_mb: 8000
  threads: 1
