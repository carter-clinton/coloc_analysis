        REF: ["other_allele", "NEA", "REF"]
        ALT: ["effect_allele", "EA", "ALT"]
        BETA: ["beta", "BETA"]
        SE: ["standard_error", "SE"]
        P: ["p_value", "P"]
        EAF: ["effect_allele_frequency", "EAF"]
    traits:
      bmi:
        ancestries:
          HIS:
            path: "GCST008025-GCST009000/GCST008053/GCST008053_buildGRCh37.tsv.gz"
            local_path: "cache/downloads/page_hchs_his/GCST008053_buildGRCh37.tsv.gz"
            md5: ""
            note: "PAGE BMI Hispanic/Latino"
      hypertension:
        note: "Systolic blood pressure in Hispanic/Latino populations as hypertension proxy"
        ancestries:
          HIS:
            path: "GCST008025-GCST009000/GCST008060/GCST008060_buildGRCh37.tsv.gz"
            local_path: "cache/downloads/page_hchs_his/GCST008060_buildGRCh37.tsv.gz"
            md5: ""
