      asthma:
        ancestries:
          EAS:
            path: "hum0197.v3.BBJ.Asthma.v1.zip"
            local_path: "cache/downloads/bbj_eas/hum0197.v3.BBJ.Asthma.v1.zip"
            md5: ""
      hypertension:
        note: "Systolic BP used as hypertension proxy (binary HTN phecode may not be available as standalone file)"
