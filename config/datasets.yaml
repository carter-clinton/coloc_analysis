          EAS:
            path: "hum0197.v3.BBJ.SBP.v1.zip"
            local_path: "cache/downloads/bbj_eas/hum0197.v3.BBJ.SBP.v1.zip"
            md5: ""

  page_hchs_his:
    description: "PAGE consortium + HCHS/SOL Hispanic/Latino GWAS summary statistics. PMID: 31217584."
    base_url: "https://ftp.ebi.ac.uk/pub/databases/gwas/summary_statistics"
    defaults:
      compression: "gzip"
      sep: "\t"
