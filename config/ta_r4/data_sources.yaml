# ta-r4 data sources (REQ-PUBLIC-DATA-ONLY). Every entry: license + public: true.
# Paths are repo-relative; durable storage is data/r4 (symlink, bin/r4_link_storage.sh).
sources:
  ldsc_1000G_Phase3_plinkfiles:
    name: LDSC 1000 Genomes Phase 3 plink files (EUR QC, HapMap3)
    url: https://zenodo.org/records/10515792/files/1000G_Phase3_plinkfiles.tgz
    license: CC-BY-4.0
    public: true
    build: GRCh37
    checksum: {md5: a7773ab485827b533cb300c76356d76b, size_bytes: 288277344}

  onekg_phase3_vcf:
    name: 1000 Genomes Phase 3 VCFs + EUR/AFR sample lists (existing copy)
    url: data/r4/inputs/1kg_vcf
    license: 1000 Genomes open data (no restrictions)
    public: true
    build: GRCh37
    checksum: null

  ukbb_ld_weissbrod_337k:
    name: UK Biobank 337k British-ancestry LD (Weissbrod et al. 2020, PolyFun)
    url: s3://broad-alkesgroup-ukbb-ld/UKBB_LD/
    license: CC BY-4.0 (AWS Open Data)
    public: true
    build: hg19
    checksum: null

  pan_ukbb_ld:
    name: Pan-UKBB EUR LD (documented alternate; not used)
    url: s3://pan-ukb-us-east-1/ld_release/UKBB.EUR.ldadj.bm
    license: CC BY-4.0 (Pan-UKB release)
    public: true
    build: GRCh37
    checksum: null
    used: false

  eqtl_catalogue_QTS000015:
    name: GTEx v8 eQTL/sQTL via the eQTL Catalogue (QTS000015)
    url: https://ftp.ebi.ac.uk/pub/databases/spot/eQTL/sumstats/QTS000015/
    license: open (eQTL Catalogue)
    public: true
    build: GRCh38
    checksum: null

  yengo2018_bmi_alleles:
    name: Yengo 2018 GIANT-UKBB BMI with effect/other alleles (E-2 allele restoration)
