# JSON Schema Draft-07 for config/pipeline.yaml validation
# Used by Snakemake validate() to catch missing required fields before rules fire.
$schema: "http://json-schema.org/draft-07/schema#"
title: "Pipeline Configuration"
description: "Schema for config/pipeline.yaml -- the single source of truth for all filesystem paths and pipeline parameters."
type: object
required:
  - traits
  - ancestries
  - genome_build
  - paths
  - trait_ancestries
  - onekg
  - plink
  - resources
  - finemap

properties:
  traits:
    type: array
    description: "List of traits to analyze (e.g., bmi, t2d, hypertension)"
    items:
      type: string
    minItems: 1

  ancestries:
    type: array
    description: "List of ancestry groups in the analysis"
    items:
      type: string
      enum: ["EUR", "AFR", "EAS", "HIS", "SAS", "AMR", "TRANS"]
    minItems: 1

  genome_build:
    type: string
    description: "Primary genome build for coordinates"
    enum: ["GRCh37", "GRCh38"]

  paths:
    type: object
    description: "All filesystem paths (relative to project root)"
    required:
      - raw_sumstats
      - harmonized_sumstats
      - regions_curated
      - ld_1kg_root
      - ld_reference
      - results_root
    properties:
      data_root:
        type: string
      raw_sumstats:
        type: string
      harmonized_sumstats:
        type: string
      regions_curated:
        type: string
      regions_tiled:
        type: string
      regions_bed:
        type: string
      ld_1kg_root:
        type: string
      ld_reference:
        type: string
      results_root:
        type: string
      finemap_output:
        type: string
      cache_downloads:
        type: string
      liftover_chains:
        type: string
      # Plan 01-02 (Wave 2a): UKBB-LD tile scratch cache (~170 GB when full)
      ukbb_ld_scratch:
        type: string
      # Plan 01-03 (Wave 2b): HGDP+1kG BCF slice scratch cache
      hgdp_1kg_scratch:
        type: string

  trait_ancestries:
    type: object
    description: "Per-trait ancestry availability mapping"
    patternProperties:
      "^[a-z0-9_]+$":
        type: array
        items:
          type: string

  onekg:
    type: object
    description: "1000 Genomes reference panel configuration"
    required:
      - version
      - populations
      - chromosomes
    properties:
      version:
        type: string
      populations:
        type: object
      chromosomes:
        type: array
        items:
          type: string
      ftp_base:
        type: string
      vcf_template:
        type: string
      panel_url:
        type: string

  plink:
    type: object
    properties:
      maf:
        type: number
        minimum: 0
        maximum: 0.5
      geno:
        type: number
        minimum: 0
        maximum: 1

  resources:
    type: object
    properties:
      default_threads:
        type: integer
        minimum: 1
      default_mem_mb:
        type: integer
        minimum: 1000

  use_fixed_sumstats:
    type: boolean

  dataset_priority:
    type: object
    description: "Preferred dataset key per trait"

  finemap:
    type: object
    required:
      - output_dir
      - methods
    properties:
      output_dir:
        type: string
      methods:
        type: array
        items:
          type: string
      credible_set:
        type: number
        minimum: 0
        maximum: 1
      ld_reference_dir:
        type: string

  enable_ld_pipeline:
    type: boolean

  multitrait:
    type: object

  pgs:
    type: object

  mr:
    type: object

  # Plan 01-02 (Wave 2a): UKBB-LD tiled EUR panel config
  ukbb_ld:
    type: object
    description: "UKBB-LD (Weissbrod 2020) tiled EUR LD panel configuration"
    properties:
      bucket:
        type: string
      prefix:
        type: string
      tile_window_mb:
        type: number
      format:
        type: string

  # Plan 01-03 (Wave 2b): HGDP+1kG AFR LD panel config (gnomAD v3.1.2
  # phased haplotypes v2). URL template + region column + sample column
  # verified against bucket at wave2b_preflight.log.
  hgdp_1kg:
    type: object
    description: "HGDP+1kG AFR LD panel configuration (gnomAD v3.1.2)"
    properties:
      bucket:
        type: string
      bcf_prefix:
        type: string
      bcf_fname_template:
        type: string
      metadata_url:
        type: string
      region_column:
        type: string
      sample_column:
        type: string
      genome_build:
        type: string
        enum: ["GRCh37", "GRCh38"]
      expected_afr_n_min:
        type: integer
        minimum: 1
      expected_afr_n_max:
        type: integer
        minimum: 1

  # Plan 01-02 (Wave 2a): per-ancestry LD source selector
  ld_reference:
    type: object
    description: "Per-ancestry LD source selection (REQ-2 G4/G6)"
    properties:
      EUR_source:
        type: string
      AFR_source:
        type: string
      EAS_source:
        type: string
      HIS_source:
        type: string

  # Phase 5: Pathway + partitioned heritability analysis
  pathway:
    type: object
    description: "Pathway analysis reference data paths and parameters (Phase 5)"
    properties:
      magma_binary:
        type: string
      magma_gene_loc:
        type: string
      magma_ref_panel:
        type: string
      magma_snp_synonyms:
        type: string
      ldsc_baseline:
        type: string
      ldsc_weights:
        type: string
      ldsc_frq:
        type: string
      ldsc_plink:
        type: string
      ldsc_hapmap3:
        type: string
      ldsc_seg_gene_expr:
        type: string
      ldsc_seg_chromatin:
        type: string
      hess_ld_panel:
        type: string
      hess_partition:
        type: string
      msigdb_dir:
        type: string
      custom_pathway_gmt:
        type: string
      negative_control_gmt:
        type: string
      snp_gene_window_kb:
        type: integer
        minimum: 1
      gprofiler_bg_window_kb:
        type: integer
        minimum: 1
      permutation_n:
        type: integer
        minimum: 100
      maf_reference:
        type: string
      ld_score_reference:
        type: string
      results_dir:
        type: string

  phase2_enabled_sources:
    type: array
    description: >
      Optional Phase 2 scope filter: limits all_qtl_coloc to a subset of
      qtl_sources.yaml sources. When unset or empty, all 4 sources expand
      (gtex_eqtl + gtex_sqtl + ukbppp_pqtl + onek1k_sceqtl). T1
      first-production (Path A) sets this to ["gtex_eqtl", "gtex_sqtl"]
      per the CP#1-final scope decision (2026-04-20): pQTL requires
      SYNAPSE_AUTH_TOKEN (T2 prerequisite) and sc-eQTL requires an eQTL
      Catalogue dataset_map for OneK1K (T2 infrastructure). Consumed by
      `_qtl_coloc_per_id_jsons()` in src/snakemake/rules/qtl_coloc.smk.
    items:
      type: string
      enum:
        - gtex_eqtl
        - gtex_sqtl
        - ukbppp_pqtl
        - onek1k_sceqtl

additionalProperties: false
